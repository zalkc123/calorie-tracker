<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorieën Tracker</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1e2a38;
    --muted: #6b7a8c;
    --accent: #2f8f5b;
    --accent-soft: #e6f4ec;
    --danger: #d9534f;
    --border: #e1e7ee;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 16px; text-align: center; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .date-nav button {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-size: 1rem; cursor: pointer; color: var(--text);
  }
  .date-nav button:hover { background: var(--accent-soft); }
  #dateLabel { font-weight: 600; font-size: 1.05rem; }

  .summary { text-align: center; }
  .summary .big { font-size: 2.2rem; font-weight: 700; color: var(--accent); }
  .summary .sub { color: var(--muted); margin-top: 2px; }
  .bar-wrap {
    background: var(--border); border-radius: 999px; height: 14px;
    margin-top: 14px; overflow: hidden;
  }
  .bar {
    height: 100%; width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width .3s ease, background .3s ease;
  }
  .bar.over { background: var(--danger); }

  .goal-row { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 14px; }
  .goal-row input {
    width: 90px; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 1rem; text-align: center;
  }

  form.add-form { display: flex; flex-wrap: wrap; gap: 8px; }
  .add-form input, .add-form select {
    flex: 1 1 120px; padding: 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 1rem; background: var(--card); color: var(--text);
  }
  .add-form input#foodInput { flex: 2 1 160px; }
  .add-form button {
    flex: 1 1 100%; padding: 10px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  .add-form button:hover { filter: brightness(1.08); }

  .meal-group h3 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 8px; }
  ul.entries { list-style: none; }
  ul.entries li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  ul.entries li:last-child { border-bottom: none; }
  ul.entries .name { flex: 1; }
  ul.entries .kcal { color: var(--muted); margin-right: 12px; white-space: nowrap; }
  ul.entries button {
    background: none; border: none; color: var(--danger);
    font-size: 1rem; cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  ul.entries button:hover { background: #fdecea; }
  .empty { color: var(--muted); font-size: .95rem; padding: 8px 0; }

  .week-bars { display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; height: 120px; margin-top: 8px; }
  .week-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .week-col .col {
    width: 100%; background: var(--accent); border-radius: 6px 6px 0 0;
    min-height: 2px; transition: height .3s ease;
  }
  .week-col .col.over { background: var(--danger); }
  .week-col .lbl { font-size: .7rem; color: var(--muted); margin-top: 6px; }
  .week-col .val { font-size: .68rem; color: var(--muted); margin-bottom: 4px; min-height: 14px; }
  .week-col.today .lbl { font-weight: 700; color: var(--text); }

  .export-row { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
  .export-row button {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-size: .9rem; cursor: pointer; color: var(--text);
  }
  .export-row button:hover { background: var(--accent-soft); }

  .food-wrap { position: relative; flex: 2 1 160px; }
  .food-wrap input { width: 100%; }
  ul.suggestions {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; list-style: none; max-height: 220px; overflow-y: auto;
    z-index: 10; box-shadow: 0 4px 12px rgba(30,42,56,.12);
  }
  ul.suggestions li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px; cursor: pointer; font-size: .95rem;
  }
  ul.suggestions li:hover, ul.suggestions li.active { background: var(--accent-soft); }
  ul.suggestions .s-kcal { color: var(--muted); font-size: .85rem; white-space: nowrap; margin-left: 12px; }
  ul.suggestions .no-match { color: var(--muted); cursor: default; }

  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="container">
  <h1>🥗 Calorieën Tracker</h1>

  <div class="date-nav">
    <button id="prevDay" aria-label="Vorige dag">←</button>
    <span id="dateLabel"></span>
    <button id="nextDay" aria-label="Volgende dag">→</button>
  </div>

  <div class="card summary">
    <div class="big" id="totalKcal">0 kcal</div>
    <div class="sub" id="remainingText"></div>
    <div class="bar-wrap"><div class="bar" id="progressBar"></div></div>
    <div class="goal-row">
      <label for="goalInput">Dagdoel:</label>
      <input type="number" id="goalInput" min="500" max="10000" step="50">
      <span>kcal</span>
    </div>
  </div>

  <div class="card">
    <form class="add-form" id="addForm">
      <div class="food-wrap">
        <input type="text" id="foodInput" placeholder="Wat heb je gegeten? (typ voor suggesties)" autocomplete="off" required>
        <ul class="suggestions" id="suggestions" hidden></ul>
      </div>
      <input type="number" id="kcalInput" placeholder="kcal" min="0" max="5000" required>
      <select id="mealSelect">
        <option value="Ontbijt">Ontbijt</option>
        <option value="Lunch">Lunch</option>
        <option value="Diner" selected>Diner</option>
        <option value="Snack">Snack</option>
      </select>
      <button type="submit">Toevoegen</button>
    </form>
  </div>

  <div class="card" id="entriesCard"></div>

  <div class="card">
    <h3 style="font-size:.95rem;margin-bottom:4px;">Afgelopen 7 dagen</h3>
    <div class="week-bars" id="weekBars"></div>
  </div>

  <div class="card">
    <h3 style="font-size:.95rem;margin-bottom:4px;">Gegevens</h3>
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:8px;">
      Alles wordt lokaal in je browser opgeslagen (geen account nodig).
    </p>
    <div class="export-row">
      <button id="exportBtn">Exporteren (JSON)</button>
      <button id="importBtn">Importeren</button>
      <button id="clearBtn">Alles wissen</button>
    </div>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>

  <footer>Calorieën Tracker — werkt volledig offline</footer>
</div>

<script>
(function () {
  "use strict";

  const STORE_KEY = "calorieTracker.data.v1";
  const GOAL_KEY = "calorieTracker.goal.v1";
  const MEALS = ["Ontbijt", "Lunch", "Diner", "Snack"];

  // kcal per standaardportie
  const FOODS = [
    { name: "Boterham kaas", kcal: 120 },
        { name: "Boterham hagelslag", kcal: 140 },
    { name: "Boterham jam", kcal: 110 }, { name: "Boterham pindakaas", kcal: 160 },
    { name: "Boterham rosbief", kcal: 120 }, { name: "Tosti ham-kaas", kcal: 350 },
    { name: "Uitsmijter (2 eieren)", kcal: 450 }, { name: "Ei gekookt", kcal: 80 },
    { name: "Bospaddenstoelen-omelet", kcal: 220 }, { name: "Omelet (2 eieren)", kcal: 220 },
    { name: "Gebakken ei", kcal: 110 }, { name: "Rozijnenbol", kcal: 250 },
    { name: "Croissant", kcal: 270 }, { name: "Krentenbol", kcal: 230 },
    { name: "Cracker met kaas", kcal: 90 }, { name: "Bowl van yoghurt met fruit", kcal: 250 },
    { name: "Kwark (magere)", kcal: 100 }, { name: "Griekse yoghurt (150g)", kcal: 150 },
    { name: "Muesli met melk (kom)", kcal: 350 }, { name: "Cornflakes met melk", kcal: 250 },
    { name: "Volkorenboterham met kaas", kcal: 120 }, { name: "Pap (brinta)", kcal: 250 },
    { name: "Banaan", kcal: 100 }, { name: "Appel", kcal: 80 },
    { name: "Sinaasappel", kcal: 70 }, { name: "Druiven (handje)", kcal: 70 },
    { name: "Aardbeien (kom, 150g)", kcal: 70 }, { name: "Blauwe bessen (handje)", kcal: 55 },
    { name: "Fruit smoothie (glas)", kcal: 150 }, { name: "Sinasappelsap (glas)", kcal: 110 },
    { name: "Appelsap (glas)", kcal: 110 }, { name: "Melk halfvol (glas)", kcal: 115 },
    { name: "Chocolademelk (glas)", kcal: 180 }, { name: "Koffie zwart", kcal: 5 },
    { name: "Koffie met melk/suiker", kcal: 40 }, { name: "Thee", kcal: 2 },
    { name: "Cola (glas)", kcal: 105 }, { name: "Cola light (glas)", kcal: 0 },
    { name: "Water (glas)", kcal: 0 }, { name: "Bier (glas)", kcal: 110 },
    { name: "Wijn rood (glas)", kcal: 85 }, { name: "Wijn wit (glas)", kcal: 85 },
    { name: "Tomatensoep (kom)", kcal: 130 }, { name: "Erwtensoep (kom)", kcal: 280 },
    { name: "Groentesoep (kom)", kcal: 120 }, { name: "Pasta bolognese (portie)", kcal: 550 },
    { name: "Pasta carbonara (portie)", kcal: 650 }, { name: "Pasta pesto (portie)", kcal: 580 },
    { name: "Macaroni met kaas (portie)", kcal: 600 }, { name: "Lasagne (portie)", kcal: 650 },
    { name: "Pizza margherita (½)", kcal: 450 }, { name: "Pizza salami (½)", kcal: 550 },
    { name: "Rijst (portie, gekookt)", kcal: 250 }, { name: "Nasi/bami (portie)", kcal: 500 },
    { name: "Gebakken aardappelen (3)", kcal: 300 }, { name: "Aardappelen gekookt (3)", kcal: 210 },
    { name: "Friet middel", kcal: 350 }, { name: "Frietsaus (bakje)", kcal: 120 },
    { name: "Frikandel", kcal: 180 }, { name: "Kroket", kcal: 220 },
    { name: "Bami schijf", kcal: 180 }, { name: "Frikandel speciaal", kcal: 240 },
    { name: "Hamburger (fastfood menu)", kcal: 800 }, { name: "Hamburger (alleen)", kcal: 250 },
    { name: "Cheeseburger", kcal: 300 }, { name: "Big Mac", kcal: 500 },
    { name: "Kapsalon", kcal: 1100 }, { name: "Shoarma broodje", kcal: 600 },
    { name: "Broodje falafel", kcal: 450 }, { name: "Broodje kroket", kcal: 375 },
    { name: "Broodje warme worst", kcal: 350 }, { name: "Broodje gezond", kcal: 350 },
    { name: "Broodje kip kerrie", kcal: 400 }, { name: "Wrap kip", kcal: 450 },
    { name: "Caesar salad", kcal: 450 }, { name: "Groene salade met kip", kcal: 350 },
    { name: "Zalmsalade", kcal: 300 }, { name: "Biefstuk (150g)", kcal: 300 },
    { name: "Kipfilet gebakken (150g)", kcal: 250 }, { name: "Kipspies", kcal: 200 },
    { name: "Gebakken vis (portie)", kcal: 300 }, { name: "Zalm (150g)", kcal: 300 },
    { name: "Garnalen (150g)", kcal: 150 }, { name: "Schnitzel", kcal: 400 },
    { name: "Gehaktbal", kcal: 200 },
    { name: "Gehaktballetjes in tomatensaus", kcal: 320 }, { name: "Stampot (portie)", kcal: 400 },
    { name: "Spinazie met aardappelen", kcal: 300 }, { name: "Rode bieten", kcal: 50 },
    { name: "Broccoli (portie)", kcal: 40 }, { name: "Wortelen (portie)", kcal: 40 },
    { name: "Erwten en wortelen", kcal: 100 }, { name: "Witte kool stamppot", kcal: 250 },
    { name: "Hutspot (portie)", kcal: 350 }, { name: "Zuurkool stamppot", kcal: 350 },
    { name: "Roerbak met kip en groente", kcal: 450 }, { name: "Roerbak met tofu", kcal: 350 },
    { name: "Vegetarische burger", kcal: 220 }, { name: "Vega gehaktbal", kcal: 180 },
    { name: "Bloemkool met kaassaus", kcal: 350 }, { name: "Gekookte ham (plak)", kcal: 30 },
    { name: "Kaasblokjes (50g)", kcal: 160 }, { name: "Yoghurt drink (flesje)", kcal: 130 },
    { name: "Chocolade reep", kcal: 230 }, { name: "Mars/Snickers", kcal: 250 },
    { name: "KitKat", kcal: 210 }, { name: "Drop (handje)", kcal: 90 },
    { name: "Chips (bakje)", kcal: 160 }, { name: "Nootjes (handje)", kcal: 100 },
    { name: "Koekjes (2)", kcal: 120 }, { name: "Oreo (2)", kcal: 110 },
    { name: "Wafel", kcal: 150 }, { name: "Appelgebak (punt)", kcal: 310 },
    { name: "Worteltaart (punt)", kcal: 350 }, { name: "Chocoladekoekjes (3)", kcal: 180 },
    { name: "Ijsje (magnum)", kcal: 250 }, { name: "IJscoupe (2 bollen)", kcal: 230 },
    { name: "Brownie (punt)", kcal: 300 }, { name: "Donut", kcal: 280 },
    { name: "Muffin", kcal: 350 }, { name: "Croissant met kaas", kcal: 340 },
    { name: "Gewone yoghurt met granola", kcal: 250 }, { name: "Proteïnereep", kcal: 200 },
    { name: "Frietje oorlog", kcal: 500 }, { name: "Nacho's met kaas", kcal: 550 },
    { name: "Zelfgemaakte pizza margherita (punt)", kcal: 250 }, { name: "Dieetproduct shake", kcal: 200 },
    { name: "Lente soep", kcal: 110 }, { name: "Kippensoep (kom)", kcal: 130 },
    { name: "Vleeswaren salade", kcal: 250 }, { name: "Vegan bowl", kcal: 450 },
    { name: "Poke bowl", kcal: 500 }, { name: "Sushi (8 stuks)", kcal: 300 },
    { name: "Sushi (kom)", kcal: 600 }, { name: "Loempia", kcal: 200 }
  ].sort(function (a, b) { return a.name.localeCompare(b.name, "nl"); });


  let entries = load(STORE_KEY, {});
  let goal = parseInt(load(GOAL_KEY, "2000"), 10) || 2000;
  let currentDate = todayStr();

  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }
  function save(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function addDaysStr(dateStr, days) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d + days);
    return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
  }
  function formatDateLabel(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    const today = todayStr();
    const opts = { weekday: "long", day: "numeric", month: "long" };
    const label = dt.toLocaleDateString("nl-NL", opts);
    if (dateStr === today) return "Vandaag — " + label;
    if (dateStr === addDaysStr(today, -1)) return "Gisteren — " + label;
    return label.charAt(0).toUpperCase() + label.slice(1);
  }
  function dayEntries(dateStr) {
    return entries[dateStr] || [];
  }
  function dayTotal(dateStr) {
    return dayEntries(dateStr).reduce((sum, e) => sum + e.kcal, 0);
  }

  const dateLabelEl = document.getElementById("dateLabel");
  const totalKcalEl = document.getElementById("totalKcal");
  const remainingTextEl = document.getElementById("remainingText");
  const progressBarEl = document.getElementById("progressBar");
  const goalInputEl = document.getElementById("goalInput");
  const entriesCardEl = document.getElementById("entriesCard");
  const weekBarsEl = document.getElementById("weekBars");

  function renderSummary() {
    const total = dayTotal(currentDate);
    const pct = Math.min(100, Math.round((total / goal) * 100));
    const over = total > goal;

    dateLabelEl.textContent = formatDateLabel(currentDate);
    totalKcalEl.textContent = total.toLocaleString("nl-NL") + " kcal";
    totalKcalEl.style.color = over ? "var(--danger)" : "var(--accent)";

    const diff = goal - total;
    if (over) {
      remainingTextEl.textContent = Math.abs(diff).toLocaleString("nl-NL") + " kcal boven je doel";
    } else {
      remainingTextEl.textContent = diff.toLocaleString("nl-NL") + " kcal resterend vandaag";
    }

    progressBarEl.style.width = pct + "%";
    progressBarEl.classList.toggle("over", over);
    goalInputEl.value = goal;
  }

  function renderEntries() {
    const list = dayEntries(currentDate);
    let html = "";
    if (!list.length) {
      html = '<p class="empty">Nog niets toegevoegd op deze dag.</p>';
    } else {
      for (const meal of MEALS) {
        const items = list.filter((e) => e.meal === meal);
        if (!items.length) continue;
        html += '<div class="meal-group"><h3>' + meal + "</h3><ul class='entries'>";
        for (const item of items) {
          html += "<li><span class='name'>" + escapeHtml(item.food) +
            "</span><span class='kcal'>" + item.kcal.toLocaleString("nl-NL") +
            " kcal</span><button data-id='" + item.id + "' class='del-btn' aria-label='Verwijderen'>✕</button></li>";
        }
        html += "</ul></div>";
      }
    }
    entriesCardEl.innerHTML = html;
    entriesCardEl.querySelectorAll(".del-btn").forEach((btn) => {
      btn.addEventListener("click", function () {
        deleteEntry(this.dataset.id);
      });
    });
  }

  function renderWeek() {
    let html = "";
    const today = todayStr();
    let max = goal;
    for (let i = 6; i >= 0; i--) {
      const ds = addDaysStr(today, -i);
      max = Math.max(max, dayTotal(ds));
    }
    for (let i = 6; i >= 0; i--) {
      const ds = addDaysStr(today, -i);
      const total = dayTotal(ds);
      const h = Math.max(2, Math.round((total / max) * 90));
      const dt = new Date(ds.split("-")[0], ds.split("-")[1] - 1, ds.split("-")[2]);
      const lbl = ["zo", "ma", "di", "wo", "do", "vr", "za"][dt.getDay()];
      html += "<div class='week-col" + (ds === today ? " today" : "") + "'>" +
        "<div class='val'>" + (total || "") + "</div>" +
        "<div class='col" + (total > goal ? " over" : "") + "' style='height:" + h + "px'></div>" +
        "<div class='lbl'>" + lbl + "</div></div>";
    }
    weekBarsEl.innerHTML = html;
  }

  function render() {
    renderSummary();
    renderEntries();
    renderWeek();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  function addEntry(food, kcal, meal) {
    if (!entries[currentDate]) entries[currentDate] = [];
    entries[currentDate].push({ id: Date.now() + "" + Math.floor(Math.random() * 1000), food, kcal, meal });
    save(STORE_KEY, entries);
    render();
  }

  function deleteEntry(id) {
    entries[currentDate] = dayEntries(currentDate).filter((e) => e.id !== id);
    if (!entries[currentDate].length) delete entries[currentDate];
    save(STORE_KEY, entries);
    render();
  }

  const foodInputEl = document.getElementById("foodInput");
  const suggestionsEl = document.getElementById("suggestions");
  const kcalInputEl = document.getElementById("kcalInput");
  let activeIndex = -1;

  function hideSuggestions() {
    suggestionsEl.hidden = true;
    suggestionsEl.innerHTML = "";
    activeIndex = -1;
  }

  function highlightActive() {
    const items = suggestionsEl.querySelectorAll("li[data-idx]");
    items.forEach(function (li, i) {
      li.classList.toggle("active", i === activeIndex);
    });
  }

  function pickSuggestion(idx) {
    const items = suggestionsEl.querySelectorAll("li[data-idx]");
    const li = items[idx];
    if (!li) return;
    foodInputEl.value = li.dataset.name;
    kcalInputEl.value = li.dataset.kcal;
    hideSuggestions();
    kcalInputEl.focus();
  }

  function showSuggestions() {
    const q = foodInputEl.value.trim().toLowerCase();
    if (q.length < 2) {
      hideSuggestions();
      return;
    }
    const matches = [];
    for (const f of FOODS) {
      const n = f.name.toLowerCase();
      if (n.indexOf(q) !== -1) {
        matches.push({ start: n.indexOf(q), f: f });
        if (matches.length >= 40) break;
      }
    }
    matches.sort(function (a, b) { return a.start - b.start; });
    const top = matches.slice(0, 8).map(function (m) { return m.f; });
    if (!top.length) {
      hideSuggestions();
      return;
    }
    let html = "";
    top.forEach(function (f, i) {
      html += "<li data-idx='" + i + "' data-name='" + escapeHtml(f.name) + "' data-kcal='" + f.kcal + "'>" +
        "<span>" + escapeHtml(f.name) + "</span><span class='s-kcal'>" +
        f.kcal.toLocaleString("nl-NL") + " kcal</span></li>";
    });
    suggestionsEl.innerHTML = html;
    suggestionsEl.hidden = false;
    activeIndex = -1;

    suggestionsEl.querySelectorAll("li[data-idx]").forEach(function (li) {
      li.addEventListener("mousedown", function (e) {
        e.preventDefault();
        pickSuggestion(Number(this.dataset.idx));
      });
    });
  }

  foodInputEl.addEventListener("input", showSuggestions);
  foodInputEl.addEventListener("blur", function () {
    setTimeout(hideSuggestions, 150);
  });
  foodInputEl.addEventListener("keydown", function (e) {
    if (suggestionsEl.hidden) return;
    const count = suggestionsEl.querySelectorAll("li[data-idx]").length;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeIndex = (activeIndex + 1) % count;
      highlightActive();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIndex = activeIndex <= 0 ? count - 1 : activeIndex - 1;
      highlightActive();
    } else if (e.key === "Enter" && activeIndex >= 0) {
      e.preventDefault();
      pickSuggestion(activeIndex);
    } else if (e.key === "Escape") {
      hideSuggestions();
    }
  });

  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const food = document.getElementById("foodInput").value.trim();
    const kcal = parseInt(kcalInputEl.value, 10);
    const meal = document.getElementById("mealSelect").value;
    if (!food || isNaN(kcal) || kcal < 0) return;
    addEntry(food, kcal, meal);
    this.reset();
    document.getElementById("mealSelect").value = meal;
  });

  goalInputEl.addEventListener("change", function () {
    const v = parseInt(this.value, 10);
    if (!isNaN(v) && v >= 500 && v <= 10000) {
      goal = v;
      save(GOAL_KEY, goal);
      render();
    } else {
      this.value = goal;
    }
  });

  document.getElementById("prevDay").addEventListener("click", function () {
    currentDate = addDaysStr(currentDate, -1);
    render();
  });
  document.getElementById("nextDay").addEventListener("click", function () {
    currentDate = addDaysStr(currentDate, 1);
    render();
  });

  document.getElementById("exportBtn").addEventListener("click", function () {
    const blob = new Blob([JSON.stringify({ goal, entries }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "calorieen-tracker-export.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById("importBtn").addEventListener("click", function () {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const data = JSON.parse(reader.result);
        if (data && typeof data === "object") {
          if (Number.isInteger(data.goal)) {
            goal = data.goal;
            save(GOAL_KEY, goal);
          }
          if (data.entries && typeof data.entries === "object") {
            entries = data.entries;
            save(STORE_KEY, entries);
          }
          render();
        }
      } catch (err) {
        alert("Kon het bestand niet lezen: ongeldig JSON.");
      }
    };
    reader.readAsText(file);
    this.value = "";
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    if (confirm("Alle gegevens definitief wissen?")) {
      entries = {};
      save(STORE_KEY, entries);
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
